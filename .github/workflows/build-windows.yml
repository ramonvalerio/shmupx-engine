# Build do ShmupX Engine para Windows: GroovyMAME na tag de upstream.env + patches/ + só os drivers
# de src/shmupx.flt. Saída: artefato com o executável, o plugin do ShmupX e as licenças.
name: build-windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 240
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          path: engine

      - name: MSYS2
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            git make p7zip
            mingw-w64-x86_64-gcc mingw-w64-x86_64-python mingw-w64-x86_64-lld
            mingw-w64-x86_64-llvm mingw-w64-x86_64-libc++
            mingw-w64-x86_64-SDL2 mingw-w64-x86_64-SDL2_ttf
            mingw-w64-x86_64-ccache

      # A fonte vem da cópia guardada neste repositório (workflow mirror-upstream), não do GitHub de origem.
      - name: Baixar a fonte guardada
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = ((Get-Content engine/upstream.env | Select-String '^GROOVYMAME_TAG=') -replace '^GROOVYMAME_TAG=', '').Trim()
          gh release download "upstream-$tag" -R "${{ github.repository }}" -p "groovymame-$tag.tar.gz*" -D upstream
          if ($LASTEXITCODE -ne 0) { throw "Fonte de $tag não guardada: rode o workflow mirror-upstream" }

      - name: Fonte do GroovyMAME
        run: |
          GROOVYMAME_TAG=$(grep '^GROOVYMAME_TAG=' engine/upstream.env | cut -d= -f2 | tr -dc 'a-z0-9')
          (cd upstream && sha256sum -c "groovymame-$GROOVYMAME_TAG.tar.gz.sha256")
          mkdir mame
          # Os únicos links simbólicos da fonte são de testes da zstd (não usados no build e não criáveis no Windows).
          tar -xzf "upstream/groovymame-$GROOVYMAME_TAG.tar.gz" -C mame --strip-components=1 --exclude='*/3rdparty/zstd/tests/cli-tests/bin/*'
          cp engine/src/shmupx.flt mame/src/mame/shmupx.flt
          # Ícone do executável e da janela: o X do ShmupX no lugar do ícone do MAME.
          cp engine/resources/shmupx.ico mame/scripts/resources/windows/mame/mame.ico
          shopt -s nullglob
          for p in engine/patches/*.patch; do
            echo "patch: $p"
            git -C mame apply --whitespace=nowarn "../$p"
          done

      # Cache de compilação (ccache) entre builds: só o que mudou (patches, drivers) é recompilado.
      # Sem cabeçalho pré-compilado (PRECOMPILE=0), que o ccache não aproveita.
      - name: Restaurar cache de compilação
        uses: actions/cache/restore@v4
        with:
          path: ccache
          key: ccache-${{ hashFiles('engine/upstream.env') }}-${{ github.run_id }}
          restore-keys: ccache-${{ hashFiles('engine/upstream.env') }}-

      - name: Build
        working-directory: mame
        env:
          CCACHE_DIR: ${{ github.workspace }}\ccache
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_MAXSIZE: 4G
          CCACHE_COMPRESS: "1"
        run: |
          export MINGW64=/mingw64
          export MINGW32=
          export ARCHOPTS=-fuse-ld=lld
          export OVERRIDE_AR=llvm-ar
          ccache -z
          make -j$(nproc) SUBTARGET=shmupx PTR64=1 OPTIMIZE=3 SYMBOLS=0 SYMLEVEL=1 REGENIE=1 TOOLS=0 NOWERROR=1             PRECOMPILE=0 OVERRIDE_CC="ccache gcc" OVERRIDE_CXX="ccache g++"
          ccache -s

      - name: Guardar cache de compilação
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ccache
          key: ccache-${{ hashFiles('engine/upstream.env') }}-${{ github.run_id }}

      - name: Conferir o motor
        working-directory: mame
        run: |
          ./mameshmupx.exe -listfull sonicwi2
          ./mameshmupx.exe -showconfig | grep -E '^shmupx_ranked'

      - name: Pacote
        run: |
          GROOVYMAME_TAG=$(grep '^GROOVYMAME_TAG=' engine/upstream.env | cut -d= -f2 | tr -dc 'a-z0-9')
          out=dist/shmupx-engine
          mkdir -p "$out/plugins" "$out/legal"
          cp mame/mameshmupx.exe "$out/shmupx-engine.exe"
          cp mame/plugins/boot.lua "$out/plugins/"
          cp -r engine/plugins/shmupx "$out/plugins/"
          # Estados iniciais da partida ranked (states/<jogo>/shmupx_ranked.sta: tela de start com 1 crédito)
          cp -r engine/states "$out/states"
          # Scanlines (Configurações › Emulador no Client): shaders bgfx do GroovyMAME, as máscaras
          # deles (artwork/bgfx) e a cadeia do ShmupX (tela plana, sem cantos).
          cp -r mame/bgfx "$out/bgfx"
          mkdir -p "$out/artwork"
          cp -r mame/artwork/bgfx "$out/artwork/bgfx"
          cp engine/bgfx/chains/*.json "$out/bgfx/chains/"
          cp engine/COPYING "$out/"
          cp mame/docs/legal/* "$out/legal/"
          printf 'ShmupX Engine %s\nBase: GroovyMAME %s\nFonte: https://github.com/ramonvalerio/shmupx-engine\n' \
            "${GITHUB_SHA::7}" "$GROOVYMAME_TAG" > "$out/VERSION.txt"
          ls -la "$out"
          du -sh "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: shmupx-engine-windows
          path: dist/shmupx-engine

      # Pacote publicado na release fixa `windows-latest` (repositório público): os instaladores do
      # ShmupX Client (Windows e Linux, que roda o motor pelo Wine) baixam daqui, sem login, e
      # conferem o SHA-256. Só no push do main: cada build bom substitui o pacote.
      - name: Publicar o pacote (release windows-latest)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = "shmupx-engine-windows.zip"
          # 7-Zip: caminhos com "/" no zip (o Compress-Archive pode gravar "\", que quebra no Linux)
          7z a -tzip -mx=9 $zip ./dist/shmupx-engine/* | Out-Null
          if ($LASTEXITCODE) { throw "7z falhou" }
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          Set-Content -NoNewline -Path "$zip.sha256" -Value "$hash  $zip"
          $repo = "${{ github.repository }}"
          $notas = "Último build do main que passou: commit ${{ github.sha }}. Usado pelos instaladores do ShmupX Client."
          gh release view windows-latest -R $repo *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create windows-latest -R $repo --target "${{ github.sha }}" --title "ShmupX Engine para o Client (Windows)" --notes $notas --latest=false
          } else {
            gh release edit windows-latest -R $repo --notes $notas
          }
          gh release upload windows-latest $zip "$zip.sha256" -R $repo --clobber
          Write-Host "publicado: $hash"

